<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Seerah Companion</title>
<meta name="theme-color" content="#123d36">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: sticky player on top, tabbed study panel below; single column on phones, two columns on wide screens */
:root{
  --bg:#f4f6f4; --surface:#ffffff; --ink:#18221f; --muted:#5d6b66; --line:#dfe5e2;
  --accent:#145c50; --accent-soft:#e3efeb; --term:#8a5a14; --term-soft:#f6ecdc; --now:#fff6d9;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --ar:'Noto Naskh Arabic','Amiri','Geeza Pro','Traditional Arabic',serif;
  --ar-display:'Amiri','Noto Naskh Arabic','Geeza Pro',serif;
  --fs:17px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#151e1b; --ink:#e3ebe8; --muted:#93a39d; --line:#26322e;
  --accent:#5cc2ad; --accent-soft:#17312b; --term:#e2b062; --term-soft:#2d2415; --now:#23301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#151e1b; --ink:#e3ebe8; --muted:#93a39d; --line:#26322e;
  --accent:#5cc2ad; --accent-soft:#17312b; --term:#e2b062; --term-soft:#2d2415; --now:#23301f; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--ui);-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ar,[lang="ar"]{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:12px;padding-block:14px}
header.top h1{font-size:18px;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0}
header.top h1 small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:38px;min-width:38px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- home ---------- */
.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font:inherit;color:var(--ink)}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line)}
.sec-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.01em}
.sec-head span{font-size:12.5px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.eplist{list-style:none;margin:12px 0 40px;padding:0;display:flex;flex-direction:column;gap:10px}
.ep{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;text-decoration:none;color:inherit}
.ep .num{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.ep.done .num{background:var(--accent);color:var(--surface)}
.ep h3{margin:0 0 4px;font-size:16px;line-height:1.3;text-wrap:balance}
.ep p{margin:0;color:var(--muted);font-size:13.5px}
.ep .meta{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:10px;flex-wrap:wrap}
.progress{height:3px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.home-tabs{display:flex;gap:8px;margin:4px 0 12px}
.ep.soon{background:transparent;border-style:dashed}
.ep.soon .num{background:var(--line);color:var(--muted)}
.ep.soon h3{color:var(--muted);font-weight:600;font-size:15px}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.02em;padding:1px 8px;border-radius:99px;background:var(--term-soft);color:var(--term)}
.resume{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;margin-top:14px;padding:12px;border-radius:16px;background:var(--accent-soft);border:1px solid var(--accent);text-decoration:none;color:inherit}
.resume-thumb{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--line)}
.resume-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.resume-thumb .play{position:absolute;inset:0;margin:auto;width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--surface);display:grid;place-items:center;font-size:14px;padding-left:2px}
.resume-body{display:flex;flex-direction:column;gap:4px;min-width:0}
.resume .eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.resume-title{font-weight:700;font-size:15px;line-height:1.3}
.resume .progress{margin-top:4px;background:var(--surface)}
.resume-meta{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:380px){.resume{grid-template-columns:96px 1fr}}

/* ---------- player view ---------- */
.player-layout{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.player-layout>*{min-width:0}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:8px}
.video{position:relative;aspect-ratio:16/9;max-width:100%;background:#000;border-radius:12px;overflow:hidden}
.video iframe,.video #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.nowbar{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;min-width:0}
.nowbar .chap{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.nowbar .chap b{color:var(--ink);font-weight:600}
.speed{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 8px;font-size:12px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:6px;overflow-x:auto;scrollbar-width:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stage-h,0px));z-index:4;background:var(--bg)}
.tabs button{border:0;background:none;padding:10px 12px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.panel{padding:12px 0 120px}
.ep-head h2{font-size:20px;line-height:1.25;margin:4px 0 6px;text-wrap:balance}
.ep-head .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ep-head p{color:var(--muted);margin:0 0 6px;max-width:65ch}
.toolrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.toolrow .grow{flex:1}

/* transcript */
.transcript{display:flex;flex-direction:column;gap:2px;font-size:var(--fs);line-height:1.65}
.seg{display:grid;grid-template-columns:1fr;gap:8px;padding:6px 10px;border-radius:10px;cursor:pointer}
.seg .ts{display:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:.35em}
body.show-ts .seg{grid-template-columns:46px 1fr}
body.show-ts .seg .ts{display:block}
.seg.now{background:var(--now)}
.seg .txt{min-width:0;overflow-wrap:anywhere}
.chap-mark{margin:18px 0 6px;padding:0 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.chap-mark:first-child{margin-top:4px}
.term{color:var(--term);font-weight:600;border-bottom:1px dotted currentColor;cursor:help}
.term .arw{font-weight:400;color:var(--muted)}
.term .arw .ar{color:var(--term);font-size:1.05em}
body.hide-ar .term .arw{display:none}
.recite{background:var(--term-soft);border-radius:10px;padding:10px 12px;margin:2px 0}
.recite .ar{display:block;font-family:var(--ar-display);font-size:1.45em;line-height:1.9;text-align:right}
.recite .tl{display:block;font-style:italic;color:var(--muted);font-size:.92em;margin-top:4px}
.recite .en{display:block;margin-top:4px}
.recite .ref{display:block;margin-top:6px;font-size:12px;font-weight:700;letter-spacing:.04em;color:var(--term)}
mark{background:var(--term-soft);color:inherit;border-radius:3px}

/* chapters */
.chapters{display:flex;flex-direction:column;gap:12px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.chapter.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.chapter summary{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
.chapter summary::-webkit-details-marker{display:none}
.chapter .cn{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}
.chapter.now .cn{background:var(--accent);color:var(--surface)}
.chapter h3{margin:0;font-size:16px;line-height:1.3;flex:1;min-width:0;text-wrap:balance}
.chapter h3 small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.chapter .chev{flex:none;color:var(--muted);transition:transform .2s}
.chapter[open] .chev{transform:rotate(180deg)}
.chapter .body{padding:0 16px 14px 56px}
.chapter .body .jump{margin-top:4px}
@media (max-width:420px){.chapter .body{padding-left:16px}}
.chapter .jump{border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.chapter p{margin:8px 0;max-width:65ch;font-size:15.5px;line-height:1.6}
.chapter ul{margin:6px 0 0;padding-left:20px;color:var(--ink)}
.chapter li{margin:3px 0;font-size:14.5px}
.lessons{background:var(--accent-soft);border-radius:14px;padding:14px 16px}
.lessons h3{margin:0 0 6px;font-size:15px;color:var(--accent)}
.lessons ol{margin:0;padding-left:20px}
.lessons li{margin:5px 0}

/* glossary */
.gloss{display:flex;flex-direction:column;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.gitem{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.gitem:first-child{border-top:0}
.gitem .t{font-weight:700}
.gitem .a{font-family:var(--ar-display);font-size:22px;line-height:1.2;grid-row:span 2;align-self:center}
.gitem .m{color:var(--muted);font-size:14px}
.gitem .cat{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--term);font-weight:700;margin-left:6px}
.gitem .eps{grid-column:1/-1;font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* popover */
.pop{padding-right:44px!important;position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
.pop .a{font-family:var(--ar-display);font-size:28px;float:right;line-height:1.1;margin-left:12px}
.pop .t{font-weight:700;font-size:17px}
.pop .m{margin-top:6px;color:var(--ink);clear:both}
.pop .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer;display:none}
.follow{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--accent);color:var(--surface);border:0;border-radius:99px;padding:10px 16px;font-weight:700;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
.empty{color:var(--muted);padding:30px 0;text-align:center}

/* compact player + controls */
.ctrls{display:flex;align-items:center;gap:6px;flex:none}
.cbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-width:34px;height:32px;padding:0 6px;display:inline-grid;place-items:center;cursor:pointer;color:var(--ink);font-size:16px;line-height:1}
.cbtn.play{background:var(--accent);color:var(--surface);border-color:var(--accent);min-width:40px}
.mini-only{display:none}
.stage.compact{display:grid;grid-template-columns:44% minmax(0,1fr);gap:12px;align-items:center}
.stage.compact .nowbar{margin-top:0;flex-direction:column;align-items:stretch;gap:8px}
.stage.compact .chap{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12.5px;line-height:1.35}
.stage.compact .ctrls{justify-content:space-between;flex-wrap:wrap;gap:4px}
.stage.compact .mini-only{display:inline-grid}
.stage.compact .video{border-radius:10px}
.tabcount{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:var(--accent-soft);color:var(--accent);font-size:11px;margin-left:2px;padding:0 5px}

/* find bar */
.findbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stage-h,0px) + var(--tabs-h,0px) + 4px);z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.08);display:flex;align-items:center;gap:6px;margin:0 0 10px;padding:6px;border:1px solid var(--accent);border-radius:12px;background:var(--surface)}
.findbar input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--ink);padding:6px 4px;outline:none}
.findcount{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.seg mark{background:var(--term-soft);color:inherit;border-radius:3px;box-shadow:0 0 0 1px var(--term)}
.seg.hit-cur mark{background:var(--term);color:var(--surface)}
.iconbtn[aria-pressed="true"]#tFind{background:var(--accent-soft)}

/* bookmarks */
.seg.bm{box-shadow:inset 3px 0 0 var(--term);background:linear-gradient(90deg,var(--term-soft),transparent 60%)}
.seg.bm.now{background:var(--now)}
.seg{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tip{font-size:13px;color:var(--muted);margin:0 0 8px;padding:0 10px}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--surface);border-radius:18px 18px 0 0;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sheet .eyebrow,.note-group .eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--term);font-weight:700}
.sheet-quote{font-size:16px;font-weight:500;line-height:1.5;margin:10px 0 12px;padding-left:12px;border-left:3px solid var(--term)}
.sheet-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.sheet textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
.sheet-actions{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.sheet-foot{font-size:12px;color:var(--muted);margin:10px 0 0}
.iconbtn.primary{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.iconbtn.danger{color:#b3261e;border-color:currentColor}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40}
.note-group{margin-bottom:8px}
.note-ep{margin:6px 0 10px;color:var(--muted);font-size:14px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.note blockquote{margin:0;padding-left:12px;border-left:3px solid var(--term);font-size:15px;line-height:1.55}
.note-text{margin:10px 0 0;font-size:14.5px;background:var(--term-soft);border-radius:10px;padding:8px 10px}
.note-actions{display:flex;align-items:center;gap:8px;margin-top:10px}
.jump{border:0;background:var(--accent-soft);color:var(--accent);border-radius:8px;padding:5px 10px;font-size:12.5px;font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.empty-state{text-align:center;padding:40px 12px;color:var(--muted);max-width:420px;margin:0 auto}
.empty-state h2{color:var(--ink);font-size:18px;margin:10px 0 6px}
.es-icon{display:inline-grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--term-soft);color:var(--term)}

/* review */
.rv-top{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);font-weight:600;margin:6px 0}
.rv-bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-bottom:14px}
.rv-bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.rv-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 18px;min-height:180px}
.rv-card .eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.rv-q{font-size:19px;line-height:1.45;font-weight:600;margin:8px 0 0;text-wrap:pretty}
.rv-a{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line)}
.rv-a .eyebrow{color:var(--term)}
.rv-a p{font-size:16.5px;line-height:1.55;margin:6px 0 12px}
.rv-actions{display:flex;gap:10px;margin-top:14px}
.rv-actions .iconbtn{flex:1;height:46px;font-size:15px}
.rv-done{text-align:center;padding:16px 0}
.rv-score{font-size:56px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1}
.rv-score span{font-size:24px;color:var(--muted)}
.rv-done h2{font-size:19px;margin:8px 0 14px}
.rv-done p{color:var(--muted);margin:0 0 8px}
.rv-missed{list-style:none;padding:0;margin:0 0 8px;text-align:left;display:flex;flex-direction:column;gap:8px}
.rv-missed li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rv-done .sheet-actions{justify-content:center}

@media (min-width:960px){
  .player-layout{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:24px;align-items:start}
  .stage{top:12px;padding-top:4px}
  .panel{padding-bottom:40px}
  .side{max-height:calc(100vh - 24px);overflow:auto;position:sticky;top:12px}
  .tabs{top:0}
  .findbar{top:calc(var(--tabs-h,0px) + 4px)}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="pop" id="pop" hidden></div>
<div class="sheet-bg" id="sheetbg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden></div>
<button class="follow" id="follow" hidden>↓ Back to live line</button>

<script>
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0'); };
const store = {

  set(k, v) { try { localStorage.setItem('seerah:' + k, JSON.stringify(v)); } catch {} }
};
const prefs = Object.assign({ arabic: true, fs: 17, speed: 1, follow: true, times: false, compact: false }, store.get('prefs', {}));

document.body.classList.toggle('hide-ar', !prefs.arabic);

let INDEX = [], GLOSS = [], GLOSS_MAP = {};
const isReady = e => e.ready !== false;
const READY = () => INDEX.filter(isReady);
const epCache = {};
async function getJSON(u) { const r = await fetch(u, { cache: 'no-cache' }); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); }

// [[translit|arabic]] -> term span
function renderText(t) {
  return esc(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (_, a, b) =>
    `<span class="term" data-t="${a}">${a}<span class="arw"> (<bdi class="ar" lang="ar">${b}</bdi>)</span></span>`)
    .replace(/\[\[([^|\]]+)\]\]/g, (_, a) => `<span class="term" data-t="${a}">${a}</span>`);
}
const plain = t => String(t||'').replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, '$1 $2').replace(/\[\[([^|\]]+)\]\]/g, '$1');
const segText = s => s.kind === 'arabic' ? [s.translit, s.en, s.ar].filter(Boolean).join(' ') : plain(s.text);

function viewHome(tab='episodes') {

  bindTheme();

  if (tab === 'notes') return renderNotes($('#home-body'));
  const last = store.get('last', null);
  const body = $('#home-body');
  body.innerHTML = `
    <input class="search" id="q" type="search" placeholder="Search titles, chapters and transcripts" autocomplete="off">
    ${continueCard(last)}
    <div class="sec-head"><h2>All episodes</h2><span id="epcount"></span></div>
    <ul class="eplist" id="eps"></ul>`;
  const draw = (items, hits={}) => {
    $('#epcount').textContent = items === INDEX ? `${READY().length} of ${INDEX.length} ready` : `${items.length} found`;
    $('#eps').innerHTML = items.map(e => {
      if (!isReady(e)) return `<li><div class="ep soon"><span class="num">${e.n}</span>
        <span><h3>${esc(e.title)}</h3><span class="meta"><span>${fmt(e.duration)}</span><span class="badge">Transcript coming soon</span></span></span></div></li>`;
      const p = prog[e.n] || 0, pct = Math.min(100, Math.round(p / e.duration * 100));
      return `<li><a class="ep ${pct>=95?'done':''}" href="#ep-${e.n}">
        <span class="num">${e.n}</span>
        <span><h3>${esc(e.title)}</h3><p>${esc(e.overview)}</p>
        ${hits[e.n] ? `<p style="margin-top:6px"><mark>${esc(hits[e.n])}</mark></p>` : ''}
        <span class="meta"><span>${fmt(e.duration)}</span><span>${e.chapters.length} chapters</span>${e.synced === false ? '<span class="badge">Timing being refined</span>' : ''}${pct?`<span>${pct>=95?'Finished':pct+'% watched'}</span>`:''}</span>
        ${pct && pct<95 ? `<div class="progress"><i style="width:${pct}%"></i></div>` : ''}</span></a></li>`;
    }).join('') || `<li class="empty">No matches</li>`;
  };
  draw(INDEX);
  let timer;
  $('#q').oninput = e => { clearTimeout(timer); timer = setTimeout(() => searchAll(e.target.value.trim(), draw), 250); };
}
async function searchAll(q, draw) {
  if (!q) return draw(INDEX);
  const ql = q.toLowerCase(), hits = {}, out = [];
  for (const e of READY()) {
    let hit = (e.title + ' ' + e.overview + ' ' + e.chapters.join(' ')).toLowerCase().includes(ql);
    if (!hit) {
      const ep = await loadEp(e.n).catch(()=>null);
      const s = ep && ep.segments.find(s => plain(s.text || (s.ar+' '+s.translit+' '+s.en)).toLowerCase().includes(ql));
      if (s) { hit = true; hits[e.n] = `${fmt(s.t)} · ` + plain(s.text || s.en).slice(0, 140); }
    }
    if (hit) out.push(e);
  }
  draw(out, hits);
}

function continueCard(last) {
  const e = last && INDEX.find(x => x.n === last.n);
  if (!e || last.t > e.duration - 30) return '';
  const pct = Math.min(100, Math.round(last.t / e.duration * 100)), left = Math.max(1, Math.round((e.duration - last.t) / 60));
  return `<a class="resume" href="#ep-${e.n}">
    <span class="resume-thumb"><img src="https://i.ytimg.com/vi/${e.id}/mqdefault.jpg" alt="" loading="lazy"><span class="play" aria-hidden="true">▶</span></span>
    <span class="resume-body">
      <span class="eyebrow">Continue watching · Episode ${e.n}</span>
      <span class="resume-title">${esc(e.title)}</span>
      <span class="progress"><i style="width:${pct}%"></i></span>
      <span class="resume-meta">${fmt(last.t)} of ${fmt(e.duration)} · ${left} min left</span>
    </span></a>`;
}

function showTerm(t) {
  const g = GLOSS_MAP[t.toLowerCase()];
  const pop = $('#pop');
  pop.innerHTML = `<button class="x" style="display:block" aria-label="Close">×</button>
    ${g ? `<div class="a" lang="ar">${esc(g.arabic)}</div><div class="t">${esc(g.translit)}</div><div class="m">${esc(g.meaning)}</div>`
        : `<div class="t">${esc(t)}</div><div class="m" style="color:var(--muted)">No glossary entry yet.</div>`}`;
  pop.hidden = false;
  pop.querySelector('.x').onclick = () => pop.hidden = true;
}
document.addEventListener('click', e => { if (!e.target.closest('#pop') && !e.target.closest('.term')) $('#pop').hidden = true; });

function seek(t) {
  if (!player?.seekTo) return;
  player.seekTo(t, true); player.playVideo?.();
  userScrolled = false; $('#follow').hidden = true;
  setTimeout(() => tick(true), 150);
}

function makePlayer(id, start) {
  clearInterval(ticker);
  const create = () => {
    player = new YT.Player('yt', {
      videoId: id,
      playerVars: { start: Math.floor(start), playsinline: 1, rel: 0, modestbranding: 1, cc_load_policy: 0 },
      events: { onReady: () => { player.setPlaybackRate(prefs.speed); tick(true); } }
    });
    ticker = setInterval(() => tick(false), 400);
  };
  if (window.YT?.Player) create(); else window.onYouTubeIframeAPIReady = create;
}

function tick(force) {
  if (!EP) return;
  const t = player?.getCurrentTime ? player.getCurrentTime() : 0;
  const playing = player?.getPlayerState?.() === 1, pp = $('#playpause');
  if (pp && pp.dataset.playing !== String(playing)) { pp.dataset.playing = playing; pp.innerHTML = playing ? ICON.pause : ICON.play; }
  // save progress
  if (t > 0 && player?.getPlayerState?.() === 1) {
    const p = store.get('progress', {}); if (Math.abs((p[EP.n]||0) - t) > 4) { p[EP.n] = t; store.set('progress', p); store.set('last', { n: EP.n, t }); }
  }
  // segment
  let i = EP.segments.length - 1; while (i > 0 && EP.segments[i].t > t + 0.3) i--;
  const ci = Math.max(0, EP.chapters.findLastIndex(c => c.t <= t + 0.3));
  if (ci !== curChap || force) {
    curChap = ci; const c = EP.chapters[ci];
    $('#nowchap') && ($('#nowchap').innerHTML = c ? `Chapter ${ci+1}/${EP.chapters.length} · <b>${esc(c.title)}</b>` : '');
    document.querySelectorAll('.chapter').forEach(el => el.classList.toggle('now', +el.dataset.c === ci));
  }
  if (!segEls.length) return;
  if (i !== curSeg || force) {
    segEls[curSeg]?.classList.remove('now'); curSeg = i; segEls[i]?.classList.add('now');
    if (prefs.follow && !userScrolled && segEls[i]) scrollToSeg(segEls[i], force);
  }
}
// keep the live line about a third of the way down the area below the pinned video + tabs
function scrollToSeg(el, instant) {
  if (matchMedia('(min-width:960px)').matches) return el.scrollIntoView({ block: 'center', behavior: instant ? 'auto' : 'smooth' });
  const tabs = $('.tabs'), fb = $('#findbar'), covered = fb && !fb.hidden ? fb.getBoundingClientRect().bottom : tabs ? tabs.getBoundingClientRect().bottom : 0;
  const y = el.getBoundingClientRect().top + scrollY - covered - (innerHeight - covered) * 0.3;
  scrollTo({ top: Math.max(0, y), behavior: instant ? 'auto' : 'smooth' });
}
// pause auto-scroll while the user reads elsewhere
['touchmove','wheel'].forEach(ev => addEventListener(ev, () => {
  if (!segEls.length || !prefs.follow) return;
  userScrolled = true; $('#follow').hidden = false;
}, { passive: true }));

  bookmark: svg('<path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>'),
};

/* ================= bookmarks & notes ================= */
let suppressClick = false;
const allNotes = () => store.get('notes', {});
const noteCount = () => Object.keys(allNotes()).length;
const getNote = (n, i) => allNotes()[`${n}:${i}`];
function saveNote(n, i, data) { const a = allNotes(); if (data) a[`${n}:${i}`] = data; else delete a[`${n}:${i}`]; store.set('notes', a); }

function bindLongPress(root) {
  let timer = null, sx = 0, sy = 0;
  const cancel = () => { clearTimeout(timer); timer = null; };
  root.addEventListener('pointerdown', e => {
    const seg = e.target.closest('.seg'); if (!seg || e.target.closest('.term')) return;
    sx = e.clientX; sy = e.clientY; cancel();
    timer = setTimeout(() => { timer = null; suppressClick = true; navigator.vibrate?.(15); openNoteSheet(+seg.dataset.i); }, 550);
  });
  root.addEventListener('pointermove', e => { if (timer && Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel(); });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => root.addEventListener(ev, cancel));
  root.addEventListener('contextmenu', e => { if (e.target.closest('.seg')) e.preventDefault(); });
}

function openSheet(html) {
  const sh = $('#sheet'), bg = $('#sheetbg');
  sh.innerHTML = html; sh.hidden = false; bg.hidden = false;
  bg.onclick = closeSheet;
  return sh;
}
function closeSheet() { $('#sheet').hidden = true; $('#sheetbg').hidden = true; }

function openNoteSheet(i) {
  const s = EP.segments[i], existing = getNote(EP.n, i);
  const excerpt = segText(s);
  const sh = openSheet(`
    <div class="sheet-head"><span class="eyebrow">${existing ? 'Bookmarked line' : 'Bookmark this line'} · ${fmt(s.t)}</span>
      <button class="cbtn" id="shx" aria-label="Close">×</button></div>
    <h2 id="sheet-title" class="sheet-quote">${esc(excerpt.length > 260 ? excerpt.slice(0, 260) + '…' : excerpt)}</h2>
    <label for="notetext" class="sheet-label">Your note (optional)</label>
    <textarea id="notetext" rows="3" placeholder="e.g. Look up this hadith, ask about this, key point for revision…">${esc(existing?.note || '')}</textarea>
    <div class="sheet-actions">
      ${existing ? `<button class="iconbtn danger" id="shdel">Remove bookmark</button>` : ''}
      <span class="grow"></span>
      <button class="iconbtn primary" id="shsave">${existing ? 'Save note' : 'Save bookmark'}</button>
    </div>
    <p class="sheet-foot">Bookmarks are saved on this phone, in this browser.</p>`);
  $('#shx', sh).onclick = closeSheet;
  $('#shsave', sh).onclick = () => {
    saveNote(EP.n, i, { n: EP.n, i, t: s.t, text: excerpt.slice(0, 400), note: $('#notetext', sh).value.trim(), ep: EP.title, at: Date.now() });
    segEls[i]?.classList.add('bm'); closeSheet(); toast('Bookmark saved');
    document.querySelector('.tip')?.remove();
  };
  const del = $('#shdel', sh);
  if (del) del.onclick = () => { saveNote(EP.n, i, null); segEls[i]?.classList.remove('bm'); closeSheet(); toast('Bookmark removed'); };
}

function renderNotes(el) {
  const notes = Object.values(allNotes()).sort((a, b) => a.n - b.n || a.t - b.t);
  if (!notes.length) {
    el.innerHTML = `<div class="empty-state"><div class="es-icon">${ICON.bookmark}</div>
      <h2>No bookmarks yet</h2>
      <p>While watching an episode, press and hold any line of the transcript to bookmark it and add a note. Everything you save appears here, grouped by episode.</p></div>`;
    return;
  }
  const groups = {};
  notes.forEach(x => (groups[x.n] ||= []).push(x));
  el.innerHTML = Object.entries(groups).map(([n, list]) => `
    <section class="note-group">
      <div class="sec-head"><h2>Episode ${n}</h2><span>${list.length} saved</span></div>
      <p class="note-ep">${esc((INDEX.find(e => e.n === +n) || {}).title || list[0].ep || '')}</p>
      ${list.map(x => `<article class="note">
        <blockquote>${esc(x.text)}</blockquote>
        ${x.note ? `<p class="note-text">${esc(x.note)}</p>` : ''}
        <div class="note-actions">
          <button class="jump" data-open="${x.n}:${x.i}:${x.t}">▶ Play from ${fmt(x.t)}</button>
          <span class="grow"></span>
          <button class="linkbtn" data-del="${x.n}:${x.i}">Delete</button>
        </div></article>`).join('')}
    </section>`).join('') + '<div style="height:60px"></div>';
  el.onclick = e => {
    const o = e.target.closest('[data-open]');
    if (o) { const [n, , t] = o.dataset.open.split(':'); store.set('jump', { n: +n, t: +t }); location.hash = 'ep-' + n; return; }
    const d = e.target.closest('[data-del]');
    if (d) { const [n, i] = d.dataset.del.split(':'); saveNote(+n, +i, null); renderNotes(el); toast('Bookmark removed'); }
  };
}

function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.append(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(t._h); t._h = setTimeout(() => t.hidden = true, 1800);
}

/* ================= find in episode ================= */
function bindFind() {
  const bar = $('#findbar'), q = $('#findq'), cnt = $('#findcount');
  let hits = [], cur = -1, orig = new Map();
  const clearMarks = () => { orig.forEach((html, el) => { el.innerHTML = html; el.parentElement.classList.remove('hit', 'hit-cur'); }); orig.clear(); };
  const markIn = (el, re) => {
    const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT), nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(nd => {
      if (!re.test(nd.nodeValue)) return; re.lastIndex = 0;
      const frag = document.createElement('span');
      frag.innerHTML = esc(nd.nodeValue).replace(re, m => `<mark>${m}</mark>`); re.lastIndex = 0;
      nd.replaceWith(...frag.childNodes);
    });
  };
  const go = k => {
    if (!hits.length) return;
    segEls[hits[cur]]?.classList.remove('hit-cur');
    cur = (k + hits.length) % hits.length;
    const el = segEls[hits[cur]]; el.classList.add('hit-cur');
    userScrolled = true; $('#follow').hidden = false;
    scrollToSeg(el, true);
    cnt.textContent = `${cur + 1} of ${hits.length}`;
  };
  const run = () => {
    clearMarks(); hits = []; cur = -1;
    const term = q.value.trim();
    if (term.length < 2) { cnt.textContent = ''; return; }
    const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
    EP.segments.forEach((s, i) => { if (re.test(segText(s))) hits.push(i); re.lastIndex = 0; });
    hits.forEach(i => { const t = segEls[i].querySelector('.txt'); orig.set(t, t.innerHTML); markIn(t, re); segEls[i].classList.add('hit'); });
    if (!hits.length) { cnt.textContent = 'No matches'; return; }
    const now = Math.max(0, hits.findIndex(i => i >= curSeg));
    go(now);
  };
  let tmr;
  q.oninput = () => { clearTimeout(tmr); tmr = setTimeout(run, 200); };
  q.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); go(cur + (e.shiftKey ? -1 : 1)); } };
  $('#findnext').onclick = () => go(cur + 1);
  $('#findprev').onclick = () => go(cur - 1);
  $('#findclose').onclick = () => { clearMarks(); q.value = ''; cnt.textContent = ''; bar.hidden = true; $('#tFind').setAttribute('aria-pressed', false); };
  $('#tFind').onclick = () => {
    const open = bar.hidden; bar.hidden = !open; $('#tFind').setAttribute('aria-pressed', open);
    if (open) q.focus(); else $('#findclose').onclick();
  };
}

/* ================= review flashcards ================= */
function renderReview(el) {
  const cards = EP.review || [];
  if (!cards.length) {
    el.innerHTML = `<div class="empty-state"><h2>Review cards are on the way</h2><p>Flashcards for this episode will appear here after the next daily update.</p></div>`;
    return;
  }
  let order = cards.map((_, i) => i), pos = 0, shown = false, missed = [];
  const best = store.get('review', {})[EP.n];
  const draw = () => {
    if (pos >= order.length) {
      const known = order.length - missed.length;
      const r = store.get('review', {}); r[EP.n] = { known, total: order.length, at: Date.now() }; store.set('review', r);
      el.innerHTML = `<div class="rv-done">
        <div class="rv-score">${known}<span>/${order.length}</span></div>
        <h2>${known === order.length ? 'You knew every card. Masha’Allah!' : known >= order.length * 0.7 ? 'Well done' : 'Good start'}</h2>
        ${missed.length ? `<p>Worth another look:</p><ul class="rv-missed">${missed.map(i => `<li>${renderText(cards[i].q)}<button class="jump" data-ch="${cards[i].chapter}">▶ Chapter ${cards[i].chapter + 1}</button></li>`).join('')}</ul>` : ''}
        <div class="sheet-actions">
          ${missed.length ? `<button class="iconbtn" id="rvMissed">Practise the ${missed.length} missed</button>` : ''}
          <span class="grow"></span>
          <button class="iconbtn primary" id="rvAgain">Start again</button>
        </div></div>`;
      $('#rvAgain', el).onclick = () => { order = cards.map((_, i) => i); pos = 0; missed = []; shown = false; draw(); };
      const m = $('#rvMissed', el); if (m) m.onclick = () => { order = missed.slice(); pos = 0; missed = []; shown = false; draw(); };
      return;
    }
    const c = cards[order[pos]], ch = EP.chapters[c.chapter];
    el.innerHTML = `
      <div class="rv-top"><span>Card ${pos + 1} of ${order.length}</span>${best && pos === 0 ? `<span>Last time: ${best.known}/${best.total}</span>` : ''}</div>
      <div class="rv-bar"><i style="width:${pos / order.length * 100}%"></i></div>
      <article class="rv-card ${shown ? 'flipped' : ''}">
        <div class="eyebrow">Question</div>
        <p class="rv-q">${renderText(c.q)}</p>
        ${shown ? `<div class="rv-a"><div class="eyebrow">Answer</div><p>${renderText(c.a)}</p>
          ${ch ? `<button class="jump" data-ch="${c.chapter}">▶ Chapter ${c.chapter + 1}: ${esc(ch.title)}</button>` : ''}</div>` : ''}
      </article>
      <div class="rv-actions">${shown
        ? `<button class="iconbtn" id="rvNo">Review again</button><button class="iconbtn primary" id="rvYes">I knew it</button>`
        : `<button class="iconbtn primary rv-show" id="rvShow">Show answer</button>`}</div>`;
    if (shown) {
      $('#rvYes', el).onclick = () => { pos++; shown = false; draw(); };
      $('#rvNo', el).onclick = () => { missed.push(order[pos]); pos++; shown = false; draw(); };
    } else $('#rvShow', el).onclick = () => { shown = true; draw(); };
  };
  el.onclick = e => {
    const j = e.target.closest('[data-ch]'); if (j) { seek(EP.chapters[+j.dataset.ch].t); return; }
    const t = e.target.closest('.term'); if (t) showTerm(t.dataset.t);
  };
  draw();
}

/* ================= theme ================= */
function themeBtn() { return `<button class="iconbtn" id="theme" aria-label="Switch light or dark mode"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>`; }
function bindTheme() {
  $('#theme').onclick = () => {
    const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark'; store.set('theme', document.documentElement.dataset.theme);
  };
}
{ const t = store.get('theme', null); if (t) document.documentElement.dataset.theme = t; }

async function route() {
  clearInterval(ticker); player?.destroy?.(); player = null; EP = null; segEls = [];
  $('#pop').hidden = true; $('#sheet').hidden = true; $('#follow').hidden = true; userScrolled = false; scrollTo(0, 0);

  const m = h.match(/^ep-(\d+)$/);
  if (m) await viewEpisode(+m[1]); else viewHome(['glossary', 'notes'].includes(h) ? h : 'episodes');
}

  } catch (e) {
    $('#app').innerHTML = `<p class="empty">Could not load the episode list (${esc(e.message)}).</p>`; return;
